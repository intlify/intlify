name: CI

env:
  CI: true
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # A change to design documents alone (Markdown under design/ and files
  # under design/assets/) runs Lint (design docs) and skips the builds and
  # tests. scripts/detect-docs-only-change.mjs decides, comparing as GitHub's
  # path filters do: from the merge base for a pull request, from the commit
  # before a push. A manual run has no base, so every job runs.
  changes:
    runs-on: ubuntu-latest
    name: Detect changes
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect a design-document-only change
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/detect-docs-only-change.mjs

  lint:
    runs-on: ${{ matrix.os }}
    name: Lint (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Print Vite+ version
        run: vp --version

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Cache wasm-pack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml', 'Cargo.lock') }}
          restore-keys: wasm-pack-${{ runner.os }}-${{ runner.arch }}-

      - name: Build packages
        run: vp run -r build

      - name: Check
        run: vpr --no-cache -v check

  # Of the checks in vp check, only Oxfmt reads design documents: it checks
  # the Markdown and skips the figures. The Typos workflow spell-checks every
  # pull request.
  lint-docs:
    runs-on: ubuntu-latest
    name: Lint (design docs)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting
        run: vp fmt --check

  test:
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Cache wasm-pack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml', 'Cargo.lock') }}
          restore-keys: wasm-pack-${{ runner.os }}-${{ runner.arch }}-

      - name: Build packages
        run: vpr build

      - name: Testing
        env:
          VITE_LOG: vite_task=trace
        run: vpr --no-cache -v test

      - name: Run message benchmark smoke
        if: runner.os == 'Linux'
        run: vp run bench:messages:smoke

      - name: Validate message benchmark result
        if: runner.os == 'Linux'
        run: vp run bench:messages:validate

      - name: Validate minimum project-profile observation records
        if: runner.os == 'Linux'
        run: vp run bench:config:smoke

      - name: Validate authoring semantics observation records
        if: runner.os == 'Linux'
        run: vp run bench:authoring:smoke

      - name: Validate source discovery observation records
        if: runner.os == 'Linux'
        run: vp run bench:authoring-js:smoke

      - name: Validate identity reconciliation observation records
        if: runner.os == 'Linux'
        run: vp run bench:authoring-identity:smoke

      - name: Validate authoring schemas and independent vectors
        if: runner.os == 'Linux'
        run: vp run schema:authoring:check && vp run vectors:authoring:check

      - name: Validate locale canonicalization schemas and independent vectors
        if: runner.os == 'Linux'
        run: vp run schema:locale:check && vp run vectors:locale:check

      - name: Validate the locale canonicalization corpus gate
        if: runner.os == 'Linux'
        run: vp run corpus:locale:check

      - name: Validate the vocabulary schema and independent vectors
        if: runner.os == 'Linux'
        run: vp run schema:vocabulary:check && vp run vectors:vocabulary:check

      - name: Validate the verification input independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:verification:check

      - name: Validate the artifact envelope independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:envelope:check

      - name: Validate the 015 framing independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:framing:check

      - name: Validate the 015 bound independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:bounds:check

      - name: Validate the 015 construction root artifacts
        if: runner.os == 'Linux'
        run: vp run construction:check

      - name: Validate the Draft 7 pattern independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:pattern:check

      - name: Validate the Draft 7 validator value independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:validator-values:check

      - name: Validate the Draft 7 validator schema independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:validator-schemas:check

      - name: Validate the 015 profile view independent vectors
        if: runner.os == 'Linux'
        run: vp run vectors:profile-view:check

  cli-validation:
    runs-on: ${{ matrix.os }}
    name: CLI validation (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.98.1'

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build CLI
        run: vp run build:cli

      - name: Verify CLI schema
        run: vp run schema:cli:check

      - name: Test CLI crate
        run: cargo test -p intlify_cli --all-targets --color always

      - name: Check CLI package contents
        run: vp run check:cli-pack

      - name: Smoke test CLI package
        run: vp run test:cli-smoke

  binding-package-smoke:
    runs-on: ubuntu-latest
    name: Binding package smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Cache wasm-pack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml', 'Cargo.lock') }}
          restore-keys: wasm-pack-${{ runner.os }}-${{ runner.arch }}-

      - name: Build packages
        run: vpr build

      - name: Run binding package smoke
        run: vp run pack:bindings:smoke

  binding-benchmark-smoke:
    runs-on: ubuntu-latest
    name: Binding benchmark smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Cache wasm-pack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml', 'Cargo.lock') }}
          restore-keys: wasm-pack-${{ runner.os }}-${{ runner.arch }}-

      - name: Build packages
        run: vpr build

      - name: Run binding benchmark smoke
        run: vp run bench:bindings:smoke

  binding-benchmark-e2e-smoke:
    runs-on: ubuntu-latest
    name: Binding benchmark E2E smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Setup cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Install browser
        run: npx --yes playwright install --with-deps chromium

      - name: Cache wasm-pack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-workspace.yaml', 'Cargo.lock') }}
          restore-keys: wasm-pack-${{ runner.os }}-${{ runner.arch }}-

      - name: Build packages
        run: vpr build

      - name: Run binding benchmark E2E smoke
        run: vp run bench:bindings:e2e:smoke
