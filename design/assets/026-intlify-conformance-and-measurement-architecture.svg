<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1240" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="title desc">
  <title id="title">Intlify conformance and measurement architecture</title>
  <desc id="desc">Component and target specifications own semantic fixtures, benchmark phase and cost names, interval boundaries, workload dimensions, checksums, capabilities, and target budget values. Owner harnesses emit checked conformance and benchmark results. Intlify design 026 imports conformance results through campaigns and benchmark results through versioned lossless measurement projections without renaming owner operations. It creates separate semantic conformance, capability, and logical render equivalence evidence and physical measurement evidence containing exact samples, units, workloads, builds, and environments. Explicit profiles then produce comparison facts, direct or relative budget evaluations, cross-platform descriptive reports, and separate workflow dispositions for CI or Release. Semantic conformance and physical speed remain separate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill"/>
    </marker>
    <style>
      .canvas { fill:#ffffff; }
      .title { fill:#111827; }
      .subtitle { fill:#4b5563; }
      .label { fill:#111827; }
      .muted { fill:#4b5563; }
      .panel { fill:#f8fafc; stroke:#cbd5e1; }
      .card { fill:#ffffff; stroke:#cbd5e1; }
      .semantic-panel { fill:#f0fdfa; stroke:#0f766e; }
      .physical-panel { fill:#eff6ff; stroke:#1d4ed8; }
      .policy-panel { fill:#faf5ff; stroke:#7c3aed; }
      .owner-head { fill:#334155; }
      .semantic-head { fill:#0f766e; }
      .physical-head { fill:#1d4ed8; }
      .policy-head { fill:#7c3aed; }
      .outcome-head { fill:#b45309; }
      .note { fill:#fff7ed; stroke:#c2410c; }
      .arrow { stroke:#64748b; }
      .arrow-fill { fill:#64748b; }
      .white { fill:#ffffff; }
      .soft-white { fill:#e5e7eb; }
      .divider { stroke:#94a3b8; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill:#020617; }
        .title { fill:#f8fafc; }
        .subtitle { fill:#cbd5e1; }
        .label { fill:#f1f5f9; }
        .muted { fill:#cbd5e1; }
        .panel { fill:#0f172a; stroke:#475569; }
        .card { fill:#111827; stroke:#475569; }
        .semantic-panel { fill:#071b1a; stroke:#2dd4bf; }
        .physical-panel { fill:#0b1733; stroke:#60a5fa; }
        .policy-panel { fill:#1e1233; stroke:#a78bfa; }
        .note { fill:#2a160b; stroke:#fb923c; }
        .arrow { stroke:#cbd5e1; }
        .arrow-fill { fill:#cbd5e1; }
        .divider { stroke:#64748b; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="1240" class="canvas"/>

  <text x="720" y="42" font-size="24" font-weight="700" text-anchor="middle" class="title">Conformance proves meaning; measurement observes physical cost</text>
  <text x="720" y="70" font-size="13" text-anchor="middle" class="subtitle">026 preserves owner-defined operations, adds common evidence, and admits comparison only through explicit policy.</text>

  <!-- Owner specifications -->
  <rect x="40" y="100" width="1360" height="190" rx="14" class="panel" stroke-width="2"/>
  <text x="720" y="130" font-size="17" font-weight="700" text-anchor="middle" class="label">Owner specifications — semantic and measurement authority</text>

  <rect x="70" y="155" width="395" height="105" rx="9" class="owner-head"/>
  <text x="267" y="180" font-size="13" font-weight="700" text-anchor="middle" class="white">Component designs</text>
  <text x="267" y="205" font-size="10.5" text-anchor="middle" class="soft-white">015 resolver · parser · resource · linker · exporter</text>
  <text x="267" y="226" font-size="10.5" text-anchor="middle" class="soft-white">exact phase/cost · interval · workload · checksum</text>
  <text x="267" y="247" font-size="10.2" text-anchor="middle" class="soft-white">product-owned checked result schema</text>

  <rect x="522" y="155" width="395" height="105" rx="9" class="owner-head"/>
  <text x="719" y="180" font-size="13" font-weight="700" text-anchor="middle" class="white">Shared semantic specifications</text>
  <text x="719" y="205" font-size="10.5" text-anchor="middle" class="soft-white">017 artifacts · 019 Findings · 023 execution</text>
  <text x="719" y="226" font-size="10.5" text-anchor="middle" class="soft-white">024 target capabilities · 025 Release relations</text>
  <text x="719" y="247" font-size="10.2" text-anchor="middle" class="soft-white">logical result and required fixture meaning</text>

  <rect x="974" y="155" width="395" height="105" rx="9" class="owner-head"/>
  <text x="1171" y="180" font-size="13" font-weight="700" text-anchor="middle" class="white">Runtime and target designs</text>
  <text x="1171" y="205" font-size="10.5" text-anchor="middle" class="soft-white">reference Runtime · Web · iOS · Android · native</text>
  <text x="1171" y="226" font-size="10.5" text-anchor="middle" class="soft-white">physical engine · runner class · target budget values</text>
  <text x="1171" y="247" font-size="10.2" text-anchor="middle" class="soft-white">capability declaration and target-specific cases</text>

  <!-- Checked owner results -->
  <path d="M 267 260 L 267 335" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M 719 260 L 719 315 L 470 315 L 470 335" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M 719 260 L 719 315 L 970 315 L 970 335" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M 1171 260 L 1171 335" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>

  <rect x="105" y="335" width="555" height="125" rx="12" class="semantic-panel" stroke-width="2"/>
  <rect x="130" y="355" width="505" height="38" rx="7" class="semantic-head"/>
  <text x="382" y="380" font-size="13" font-weight="700" text-anchor="middle" class="white">Checked owner conformance results</text>
  <text x="382" y="417" font-size="10.7" text-anchor="middle" class="label">suite + fixture + subject + expected/observed logical result</text>
  <text x="382" y="439" font-size="10.3" text-anchor="middle" class="muted">pass · fail · applicability · Finding and capability associations</text>

  <rect x="780" y="335" width="555" height="125" rx="12" class="physical-panel" stroke-width="2"/>
  <rect x="805" y="355" width="505" height="38" rx="7" class="physical-head"/>
  <text x="1057" y="380" font-size="13" font-weight="700" text-anchor="middle" class="white">Checked owner benchmark results</text>
  <text x="1057" y="417" font-size="10.7" text-anchor="middle" class="label">owner schema/profile + phase/cost + exact measured operation</text>
  <text x="1057" y="439" font-size="10.3" text-anchor="middle" class="muted">samples · checksum · workload · build · environment</text>

  <!-- 026 admission -->
  <path d="M 382 460 L 382 535" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M 1057 460 L 1057 535" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>

  <rect x="40" y="535" width="1360" height="235" rx="14" class="panel" stroke-width="2.5"/>
  <text x="720" y="568" font-size="18" font-weight="700" text-anchor="middle" class="label">026 common admission — preserves authority; adds shared verification meaning</text>

  <rect x="80" y="600" width="385" height="125" rx="10" class="semantic-panel" stroke-width="2"/>
  <text x="272" y="629" font-size="13" font-weight="700" text-anchor="middle" class="label">Conformance campaign admission</text>
  <text x="272" y="655" font-size="10.5" text-anchor="middle" class="muted">content-addressed suite closure</text>
  <text x="272" y="676" font-size="10.5" text-anchor="middle" class="muted">applicability · logical result · Finding projection</text>
  <text x="272" y="697" font-size="10.5" text-anchor="middle" class="muted">capability coverage · cross-target equivalence</text>

  <rect x="527" y="600" width="385" height="125" rx="10" class="physical-panel" stroke-width="2"/>
  <text x="719" y="629" font-size="13" font-weight="700" text-anchor="middle" class="label">Versioned measurement projection</text>
  <text x="719" y="655" font-size="10.5" text-anchor="middle" class="muted">lossless exact units · raw samples</text>
  <text x="719" y="676" font-size="10.5" text-anchor="middle" class="muted">common category + operation class</text>
  <text x="719" y="697" font-size="10.5" text-anchor="middle" class="muted">never rename or merge owner phase/cost</text>

  <rect x="974" y="600" width="385" height="125" rx="10" class="policy-panel" stroke-width="2"/>
  <text x="1166" y="629" font-size="13" font-weight="700" text-anchor="middle" class="label">Evidence integrity admission</text>
  <text x="1166" y="655" font-size="10.5" text-anchor="middle" class="muted">subject · build · target · service identity</text>
  <text x="1166" y="676" font-size="10.5" text-anchor="middle" class="muted">suite/profile revisions · artifact references</text>
  <text x="1166" y="697" font-size="10.5" text-anchor="middle" class="muted">complete result · typed missing/failure state</text>

  <path d="M 465 662 L 527 662" fill="none" class="divider" stroke-width="1.7" stroke-dasharray="6 5"/>
  <path d="M 912 662 L 974 662" fill="none" class="divider" stroke-width="1.7" stroke-dasharray="6 5"/>

  <!-- Evidence outputs -->
  <path d="M 350 770 L 350 825" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M 1090 770 L 1090 825" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>

  <rect x="80" y="825" width="570" height="130" rx="12" class="semantic-panel" stroke-width="2"/>
  <rect x="105" y="845" width="520" height="38" rx="7" class="semantic-head"/>
  <text x="365" y="870" font-size="13" font-weight="700" text-anchor="middle" class="white">Semantic evidence</text>
  <text x="365" y="907" font-size="10.7" text-anchor="middle" class="label">Conformance · Capability · Finding preservation</text>
  <text x="365" y="930" font-size="10.5" text-anchor="middle" class="muted">Logical Render Equivalence · hydration equality</text>

  <rect x="790" y="825" width="570" height="130" rx="12" class="physical-panel" stroke-width="2"/>
  <rect x="815" y="845" width="520" height="38" rx="7" class="physical-head"/>
  <text x="1075" y="870" font-size="13" font-weight="700" text-anchor="middle" class="white">Physical measurement evidence</text>
  <text x="1075" y="907" font-size="10.7" text-anchor="middle" class="label">exact samples · units · workload · semantic checksum</text>
  <text x="1075" y="930" font-size="10.5" text-anchor="middle" class="muted">artifact size · init · loading · formatting · toolchain · memory</text>

  <!-- Evaluation -->
  <path d="M 365 955 L 365 1008 L 720 1008 L 720 1035" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M 1075 955 L 1075 1008 L 720 1008 L 720 1035" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>

  <rect x="265" y="1035" width="910" height="105" rx="12" class="policy-panel" stroke-width="2"/>
  <rect x="290" y="1055" width="250" height="55" rx="8" class="policy-head"/>
  <text x="415" y="1078" font-size="11.5" font-weight="700" text-anchor="middle" class="white">Comparison Evaluation</text>
  <text x="415" y="1098" font-size="9.8" text-anchor="middle" class="soft-white">profile · compatibility · statistic</text>

  <rect x="595" y="1055" width="250" height="55" rx="8" class="policy-head"/>
  <text x="720" y="1078" font-size="11.5" font-weight="700" text-anchor="middle" class="white">Budget Evaluation</text>
  <text x="720" y="1098" font-size="9.8" text-anchor="middle" class="soft-white">direct or comparison-backed</text>

  <rect x="900" y="1055" width="250" height="55" rx="8" class="policy-head"/>
  <text x="1025" y="1078" font-size="11.5" font-weight="700" text-anchor="middle" class="white">Descriptive Reporting</text>
  <text x="1025" y="1098" font-size="9.8" text-anchor="middle" class="soft-white">cross-platform rows · no ranking</text>

  <path d="M 720 1140 L 720 1170" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>

  <rect x="305" y="1170" width="830" height="45" rx="22" class="outcome-head"/>
  <text x="720" y="1190" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Evaluation facts · workflow disposition · descriptive reports</text>
  <text x="720" y="1207" font-size="9.7" text-anchor="middle" class="soft-white">satisfied / exceeded / unavailable · report / warn / block · CI or Release decision</text>

  <rect x="40" y="1038" width="190" height="96" rx="10" class="note" stroke-width="1.7"/>
  <text x="135" y="1065" font-size="11" font-weight="700" text-anchor="middle" class="label">Never conflated</text>
  <text x="135" y="1089" font-size="10" text-anchor="middle" class="muted">Conforming ≠ fast</text>
  <text x="135" y="1110" font-size="10" text-anchor="middle" class="muted">Fast ≠ conforming</text>

  <rect x="1210" y="1038" width="190" height="96" rx="10" class="note" stroke-width="1.7"/>
  <text x="1305" y="1065" font-size="11" font-weight="700" text-anchor="middle" class="label">No synthetic score</text>
  <text x="1305" y="1089" font-size="10" text-anchor="middle" class="muted">Unlike targets remain</text>
  <text x="1305" y="1110" font-size="10" text-anchor="middle" class="muted">descriptive only</text>
</svg>
