<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1440" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="title desc">
<title id="title">Intlify overview: compiler-based localization architecture</title>
<desc id="desc">Source-first UI, explicit Message Intent declarations, standalone MF2 messages, and library manifests enter host-specific producers. Producers emit portable Message Intent and reference artifacts into shared MF2 semantics, a resolved project profile, and finite direct-localization demand with coverage modes. Explicit synchronization and governance communicate with Provider and TMS systems, validate candidates, record digest-bound approval for source or localized artifacts plus selection and revocation evidence, and atomically publish a Translation Store snapshot. A separate deterministic build verifies the plan, pinned snapshot, and Selection Decisions, then performs final message locale fallback, reachability, delivery linking, and authoritative target capability admission. Release Assembly is the sole producer of a Release snapshot over one or more complete target output sets. A bounded Localization Execution Layer preserves the same release, selected-message, locale, output, and failure guarantees through either a runtime-backed path or a capability-checked ahead-of-time target-native path without a Provider or TMS connection.</desc>
