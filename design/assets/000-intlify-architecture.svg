<rect x="0" y="0" width="1320" height="1440" fill="none"/>

<text x="660" y="42" font-size="24" font-weight="700" text-anchor="middle" class="title">Intlify compiler-based localization architecture</text>
<text x="660" y="70" font-size="13" text-anchor="middle" class="subtitle">Source-first authoring → direct-demand planning → governed selection → release assembly → bounded target execution</text>

