<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1140" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="title desc">
<title id="title">Intlify reference runtime architecture</title>
<desc id="desc">The Intlify toolchain plans finite localization requirements, synchronizes translations into an atomic Store snapshot, performs final message locale fallback, linking, and target capability admission, then passes complete target output sets to Release Assembly above an explicit build and production-execution boundary. This diagram details the reference Intlify runtime physical path within the logical Localization Execution Layer; a capability-checked target-native engine may provide an alternative conforming path. Application and framework adapters bind compiler-lowered calls and explicit APIs to a locale-scoped Localizer and convert host values into portable Message Values. The Localization Runtime admits a compatible release, resolves opaque message handles, loads delivery units, and caches prepared messages. The language-neutral MF2 Runtime Core evaluates one already selected message through an immutable function registry and declared Locale Service Profile, returning text or structured parts with typed diagnostics. Production execution never calls a Localization Provider or TMS and never repeats Linker-owned message locale fallback.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill"/>
  </marker>
  <style>
    .title { fill:#111827; }
    .subtitle { fill:#4b5563; }
    .label { fill:#111827; }
    .muted { fill:#4b5563; }
    .panel { fill:#ffffff; stroke:#cbd5e1; }
    .group { fill:#f8fafc; stroke:#cbd5e1; }
    .runtime-boundary { fill:#f8fafc; stroke:#64748b; stroke-dasharray:10 8; }
    .tool { fill:#334155; }
    .sync { fill:#b45309; }
    .linker { fill:#0f766e; }
    .artifact { fill:#475569; }
    .adapter { fill:#0369a1; }
    .localizer { fill:#1d4ed8; }
    .service { fill:#7c3aed; }
    .core { fill:#0f766e; }
    .operation { fill:#e2e8f0; stroke:#cbd5e1; }
    .context { fill:#334155; }
    .arrow { stroke:#64748b; }
    .boundary-line { stroke:#b45309; }
    .arrow-fill { fill:#64748b; }
    .white { fill:#ffffff; }
    .soft-white { fill:#e5e7eb; }
    .operation-text { fill:#334155; }
    @media (prefers-color-scheme: dark) {
      .title { fill:#f8fafc; }
      .subtitle { fill:#cbd5e1; }
      .label { fill:#f1f5f9; }
      .muted { fill:#cbd5e1; }
      .panel { fill:#111827; stroke:#475569; }
      .group { fill:#0f172a; stroke:#475569; }
      .runtime-boundary { fill:#0f172a; stroke:#94a3b8; }
      .operation { fill:#1e293b; stroke:#475569; }
      .operation-text { fill:#e2e8f0; }
      .arrow { stroke:#cbd5e1; }
      .arrow-fill { fill:#cbd5e1; }
    }
  </style>
</defs>

<rect x="0" y="0" width="1240" height="1140" fill="none"/>

<text x="620" y="42" font-size="24" font-weight="700" text-anchor="middle" class="title">Intlify reference runtime architecture</text>
<text x="620" y="70" font-size="13" text-anchor="middle" class="subtitle">Build from pinned artifacts; execute through this reference path or a conforming target-native engine.</text>

