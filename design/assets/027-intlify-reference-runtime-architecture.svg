<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1280" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="title desc">
<title id="title">Intlify reference runtime architecture</title>
<desc id="desc">The Intlify toolchain plans finite localization requirements, synchronizes translations into an atomic Store snapshot, performs final message locale fallback, linking, and target capability admission, then passes complete target output sets to Release Assembly. Downstream of the static build, an authorized publication transaction creates a Release Publication Record, and the host verifies that record before activating a Release reference. This diagram details the reference Intlify runtime physical path within the logical Localization Execution Layer; a capability-checked target-native engine may provide an alternative conforming path. Application and framework adapters bind compiler-lowered calls and explicit APIs to a locale-scoped Localizer and convert host values into portable Message Values. The Localization Runtime execution-admits one deployment-selected Release Snapshot and matching artifacts, resolves opaque message handles, loads delivery units, and caches prepared messages. It does not publish or activate Releases. The language-neutral MF2 Runtime Core evaluates one already selected message through an immutable function registry and declared Locale Service Profile, returning text or structured parts with typed diagnostics. Production execution never calls a Localization Provider or TMS and never repeats Linker-owned message locale fallback.</desc>
