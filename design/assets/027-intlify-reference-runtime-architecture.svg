<text x="620" y="786" font-size="17" font-weight="700" text-anchor="middle" class="label">Reference Localization Runtime</text>
<text x="620" y="808" font-size="11.2" text-anchor="middle" class="muted">One physical implementation of the logical Localization Execution Layer.</text>

