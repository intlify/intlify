<text x="620" y="135" font-size="17" font-weight="700" text-anchor="middle" class="label">Intlify toolchain — build-time authority</text>

<rect x="70" y="160" width="240" height="125" rx="9" class="tool"/>
<text x="190" y="186" font-size="13" font-weight="700" text-anchor="middle" class="white">Authoring inputs</text>
<text x="190" y="211" font-size="10.5" text-anchor="middle" class="soft-white">source-first producers</text>
<text x="190" y="232" font-size="10.5" text-anchor="middle" class="soft-white">catalog resources · explicit intent</text>
<text x="190" y="253" font-size="10.5" text-anchor="middle" class="soft-white">MF2 formatter · linter</text>
<text x="190" y="274" font-size="10.5" text-anchor="middle" class="soft-white">application references</text>

<path d="M 310 222 L 345 222" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)"/>

<rect x="345" y="160" width="240" height="125" rx="9" class="sync"/>
<text x="465" y="186" font-size="13" font-weight="700" text-anchor="middle" class="white">Explicit localization sync</text>
<text x="465" y="211" font-size="10.5" text-anchor="middle" class="soft-white">Provider · TMS · AI · MT · human</text>
<text x="465" y="232" font-size="10.5" text-anchor="middle" class="soft-white">validation · provenance · approval</text>
<text x="465" y="253" font-size="10.5" text-anchor="middle" class="soft-white">atomic Translation Store snapshot</text>
<text x="465" y="274" font-size="10.5" text-anchor="middle" class="soft-white">never a production execution call</text>

<path d="M 585 222 L 620 222" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)"/>

<rect x="620" y="160" width="260" height="125" rx="9" class="linker"/>
<text x="750" y="186" font-size="13" font-weight="700" text-anchor="middle" class="white">Final link + export</text>
<text x="750" y="211" font-size="10.5" text-anchor="middle" class="soft-white">message locale fallback resolution</text>
<text x="750" y="232" font-size="10.5" text-anchor="middle" class="soft-white">reachability · delivery placement</text>
<text x="750" y="253" font-size="10.5" text-anchor="middle" class="soft-white">MF2 validation · message compilation</text>
<text x="750" y="274" font-size="10.5" text-anchor="middle" class="soft-white">Target Profile admission · registration</text>

<path d="M 880 222 L 915 222" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)"/>

<rect x="915" y="160" width="255" height="125" rx="9" class="artifact"/>
<text x="1042" y="186" font-size="13" font-weight="700" text-anchor="middle" class="white">Immutable release outputs</text>
<text x="1042" y="211" font-size="10.5" text-anchor="middle" class="soft-white">target output sets · Runtime Manifests</text>
<text x="1042" y="232" font-size="10.5" text-anchor="middle" class="soft-white">Release Assembly · Release Snapshot</text>
<text x="1042" y="253" font-size="10.5" text-anchor="middle" class="soft-white">generated Message Handles</text>
<text x="1042" y="274" font-size="10.5" text-anchor="middle" class="soft-white">current path: data-only ESM 0.1</text>

<!-- Build/runtime boundary -->
<path d="M 40 365 L 1200 365" fill="none" class="boundary-line" stroke-width="2.2" stroke-dasharray="12 8"/>
<rect x="456" y="347" width="328" height="36" rx="18" class="panel" stroke-width="1.5"/>
<text x="620" y="370" font-size="11.5" font-weight="700" text-anchor="middle" class="label">explicit build / production-execution boundary</text>

<path d="M 1042 285 L 1042 410" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)"/>

<!-- Application entry points -->
<rect x="40" y="410" width="1160" height="165" rx="14" class="group" stroke-width="2"/>
<text x="620" y="440" font-size="17" font-weight="700" text-anchor="middle" class="label">Application adapters for the reference runtime path</text>

<rect x="70" y="465" width="240" height="78" rx="9" class="adapter"/>
<text x="190" y="491" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Compiler-lowered UI calls</text>
<text x="190" y="516" font-size="10.2" text-anchor="middle" class="soft-white">generated handle + portable arguments</text>
<text x="190" y="535" font-size="9.7" text-anchor="middle" class="soft-white">no runtime intent() parsing</text>

<rect x="345" y="465" width="240" height="78" rx="9" class="adapter"/>
<text x="465" y="491" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Explicit Localizer API</text>
<text x="465" y="516" font-size="10.2" text-anchor="middle" class="soft-white">server · worker · CLI · email</text>
<text x="465" y="535" font-size="9.7" text-anchor="middle" class="soft-white">format(handle, arguments)</text>

<rect x="620" y="465" width="240" height="78" rx="9" class="adapter"/>
<text x="740" y="491" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Generated / legacy facade</text>
<text x="740" y="516" font-size="10.2" text-anchor="middle" class="soft-white">typed accessor · t() adapter</text>
<text x="740" y="535" font-size="9.7" text-anchor="middle" class="soft-white">thin delegation only</text>

<rect x="895" y="465" width="275" height="78" rx="9" class="adapter"/>
<text x="1032" y="491" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Framework / platform lifecycle</text>
<text x="1032" y="516" font-size="10.2" text-anchor="middle" class="soft-white">preload · locale negotiation · SSR</text>
<text x="1032" y="535" font-size="9.7" text-anchor="middle" class="soft-white">parts → safe UI/native output</text>

<path d="M 190 543 L 190 600 L 430 600 L 430 635" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 465 543 L 465 635" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 740 543 L 740 600 L 520 600 L 520 635" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 1032 543 L 1032 600 L 610 600 L 610 635" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>

<!-- Localization Runtime -->
<rect x="75" y="615" width="1090" height="225" rx="14" class="runtime-boundary" stroke-width="2"/>
<text x="620" y="646" font-size="17" font-weight="700" text-anchor="middle" class="label">Reference Localization Runtime</text>
<text x="620" y="668" font-size="11.2" text-anchor="middle" class="muted">One physical implementation of the logical Localization Execution Layer.</text>

<rect x="110" y="695" width="220" height="105" rx="9" class="service"/>
<text x="220" y="722" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Shared Runtime Engine</text>
<text x="220" y="747" font-size="10.2" text-anchor="middle" class="soft-white">immutable capabilities</text>
<text x="220" y="768" font-size="10.2" text-anchor="middle" class="soft-white">functions · Locale Service Profile</text>
<text x="220" y="789" font-size="9.7" text-anchor="middle" class="soft-white">shareable engine state</text>

<rect x="365" y="695" width="240" height="105" rx="9" class="localizer"/>
<text x="485" y="722" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Locale-bound Localizer</text>
<text x="485" y="747" font-size="10.2" text-anchor="middle" class="soft-white">exact requested locale</text>
<text x="485" y="768" font-size="10.2" text-anchor="middle" class="soft-white">server: request-scoped</text>
<text x="485" y="789" font-size="9.7" text-anchor="middle" class="soft-white">no process-global mutable locale</text>

<rect x="640" y="695" width="220" height="105" rx="9" class="artifact"/>
<text x="750" y="722" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Artifact registry + loader</text>
<text x="750" y="747" font-size="10.2" text-anchor="middle" class="soft-white">release · manifest · capsule admission</text>
<text x="750" y="768" font-size="10.2" text-anchor="middle" class="soft-white">delivery unit availability</text>
<text x="750" y="789" font-size="9.7" text-anchor="middle" class="soft-white">handle → selected message</text>

<rect x="895" y="695" width="235" height="105" rx="9" class="service"/>
<text x="1012" y="722" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Preparation + diagnostics</text>
<text x="1012" y="747" font-size="10.2" text-anchor="middle" class="soft-white">Prepared Message cache</text>
<text x="1012" y="768" font-size="10.2" text-anchor="middle" class="soft-white">typed runtime policy</text>
<text x="1012" y="789" font-size="9.7" text-anchor="middle" class="soft-white">stable fresh / cached behavior</text>

<path d="M 330 747 L 365 747" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 640 747 L 605 747" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 860 747 L 895 747" fill="none" class="arrow" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M 1042 410 L 1042 600 L 750 600 L 750 695" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)"/>

<!-- MF2 Runtime Core -->
<path d="M 485 800 L 485 865" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M 1012 800 L 1012 835 L 755 835 L 755 865" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)"/>

