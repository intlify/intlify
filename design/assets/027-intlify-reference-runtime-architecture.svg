<text x="620" y="896" font-size="17" font-weight="700" text-anchor="middle" class="white">Language-neutral MF2 Runtime Core</text>
<text x="620" y="918" font-size="11.2" text-anchor="middle" class="soft-white">Evaluate one selected message; no handle lookup, message locale fallback chain, loading, or framework state.</text>

<rect x="165" y="942" width="200" height="65" rx="8" class="operation" stroke-width="1.5"/>
<text x="265" y="968" font-size="12" font-weight="700" text-anchor="middle" class="operation-text">Prepare</text>
<text x="265" y="990" font-size="10.1" text-anchor="middle" class="operation-text">checked source / Runtime IR</text>

