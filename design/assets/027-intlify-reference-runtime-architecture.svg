<text x="190" y="675" font-size="9.7" text-anchor="middle" class="soft-white">no runtime intent() parsing</text>

<rect x="345" y="605" width="240" height="78" rx="9" class="adapter"/>
<text x="465" y="631" font-size="12.5" font-weight="700" text-anchor="middle" class="white">Explicit Localizer API</text>
