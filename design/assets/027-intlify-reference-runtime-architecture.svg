<rect x="0" y="0" width="1240" height="1280" fill="none"/>

<text x="620" y="42" font-size="24" font-weight="700" text-anchor="middle" class="title">Intlify reference runtime architecture</text>
<text x="620" y="70" font-size="13" text-anchor="middle" class="subtitle">Build immutable outputs; publish and activate through the host; execution-admit through a conforming path.</text>

<!-- Toolchain side -->
