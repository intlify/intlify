<rect x="485" y="1065" width="270" height="50" rx="8" class="context"/>
<text x="620" y="1086" font-size="11.5" font-weight="700" text-anchor="middle" class="white">Server request context</text>
<text x="620" y="1104" font-size="9.5" text-anchor="middle" class="soft-white">immutable artifacts shared safely</text>

<rect x="820" y="1065" width="270" height="50" rx="8" class="context"/>
<text x="955" y="1086" font-size="11.5" font-weight="700" text-anchor="middle" class="white">Mobile / native context</text>
<text x="955" y="1104" font-size="9.5" text-anchor="middle" class="soft-white">scene, view tree, task, or process</text>
