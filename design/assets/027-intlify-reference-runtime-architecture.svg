<text x="1042" y="211" font-size="10.5" text-anchor="middle" class="soft-white">target output sets · Runtime Manifests</text>
<text x="1042" y="232" font-size="10.5" text-anchor="middle" class="soft-white">Release Assembly · Release Snapshot</text>
<text x="1042" y="253" font-size="10.5" text-anchor="middle" class="soft-white">generated Message Handles</text>
<text x="1042" y="274" font-size="10.5" text-anchor="middle" class="soft-white">provisional bridge: data-only ESM 0.1</text>

<!-- Static build / downstream delivery boundary -->
