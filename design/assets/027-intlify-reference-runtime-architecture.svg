<text x="500" y="968" font-size="12" font-weight="700" text-anchor="middle" class="operation-text">Resolve + select</text>
<text x="500" y="990" font-size="10.1" text-anchor="middle" class="operation-text">Message Values · functions · variants</text>

<rect x="635" y="942" width="200" height="65" rx="8" class="operation" stroke-width="1.5"/>
<text x="735" y="968" font-size="12" font-weight="700" text-anchor="middle" class="operation-text">Format output</text>
<text x="735" y="990" font-size="10.1" text-anchor="middle" class="operation-text">text · parts · bidi</text>

<rect x="870" y="942" width="200" height="65" rx="8" class="operation" stroke-width="1.5"/>
<text x="970" y="968" font-size="12" font-weight="700" text-anchor="middle" class="operation-text">Typed outcome</text>
<text x="970" y="990" font-size="10.1" text-anchor="middle" class="operation-text">value · recoverable diagnostics</text>

