    .core { fill:#0f766e; }
    .operation { fill:#e2e8f0; stroke:#cbd5e1; }
    .context { fill:#334155; }
    .arrow { stroke:#64748b; }
    .boundary-line { stroke:#b45309; }
    .arrow-fill { fill:#64748b; }
    .white { fill:#ffffff; }
    .soft-white { fill:#e5e7eb; }
    .operation-text { fill:#334155; }
    @media (prefers-color-scheme: dark) {
      .title { fill:#f8fafc; }
      .subtitle { fill:#cbd5e1; }
