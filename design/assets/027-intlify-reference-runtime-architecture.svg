<text x="750" y="908" font-size="9.7" text-anchor="middle" class="soft-white">capsule · delivery unit availability</text>
<text x="750" y="929" font-size="9.4" text-anchor="middle" class="soft-white">execution admission · handle lookup</text>

<rect x="895" y="835" width="235" height="105" rx="9" class="service"/>
