<text x="220" y="908" font-size="10.2" text-anchor="middle" class="soft-white">functions · Locale Service Profile</text>
<text x="220" y="929" font-size="9.7" text-anchor="middle" class="soft-white">shareable engine state</text>

<rect x="365" y="835" width="240" height="105" rx="9" class="localizer"/>
