<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" role="img" aria-labelledby="title desc">
  <title id="title">One immutable snapshot, two different relations</title>
  <desc id="desc">An immutable graph snapshot retains exact scope, input membership and presence, source evidence, declarations and exclusions, owner outcomes, and diagnostics. Its reference relation connects each checked use-site occurrence to its admitted Intent target; separate occurrences may share one Intent, and unreferenced declarations remain present. Its computation relation instead connects an owner product to each exact input or registered product facet it consumed. Computation edges retain typed roles, full stamps, and operation profiles, and invalidation traverses them in reverse. Containment and inverse indexes are lookup aids, not additional computation edges. Final reachability remains owned by 020.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #111827; }
      .muted { fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .input { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .step { fill: #1d4ed8; }
      .output { fill: #0f766e; }
      .note { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.5; }
      .white { fill: #ffffff; }
      .soft-white { fill: #f1f5f9; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-fill { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #020617; }
        .title { fill: #f8fafc; }
        .muted { fill: #cbd5e1; }
        .panel { fill: #0f172a; stroke: #475569; }
        .input { fill: #1e293b; stroke: #64748b; }
        .note { fill: #062c2a; stroke: #2dd4bf; }
        .arrow { stroke: #cbd5e1; }
        .arrow-fill { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect width="1280" height="790" class="canvas" />
  <text x="640" y="42" text-anchor="middle" font-size="25" font-weight="700" class="title">One immutable snapshot, two different relations</text>
  <text x="640" y="74" text-anchor="middle" class="muted">Exact owner / scope · retained inputs and owner results · indexes local to this snapshot</text>

  <g data-card="snapshot-context">
    <rect x="40" y="106" width="1200" height="78" rx="12" class="input" />
    <text x="60" y="136" font-size="18" font-weight="700" class="title">Snapshot context</text>
    <text x="60" y="164" class="muted">Input membership + presence · sources + evidence · declarations / exclusions · outcomes + diagnostics</text>
  </g>

  <rect x="40" y="214" width="580" height="446" rx="12" class="panel" />
  <text x="64" y="248" font-size="20" font-weight="700" class="title">Reference relation</text>
  <text x="64" y="277" class="muted">A use site points to its checked Intent target.</text>
  <g data-card="reference-a">
    <rect x="64" y="306" width="210" height="78" rx="10" class="step" />
    <text x="169" y="337" text-anchor="middle" font-size="18" font-weight="700" class="white">Reference A</text>
    <text x="169" y="365" text-anchor="middle" class="soft-white">Exact occurrence A</text>
  </g>
  <g data-card="reference-b">
    <rect x="64" y="412" width="210" height="78" rx="10" class="step" />
    <text x="169" y="443" text-anchor="middle" font-size="18" font-weight="700" class="white">Reference B</text>
    <text x="169" y="471" text-anchor="middle" class="soft-white">Exact occurrence B</text>
  </g>
  <g data-card="shared-intent">
    <rect x="362" y="350" width="234" height="96" rx="10" class="output" />
    <text x="479" y="385" text-anchor="middle" font-size="18" font-weight="700" class="white">Intent A</text>
    <text x="479" y="417" text-anchor="middle" class="soft-white">One ID + current revision</text>
  </g>
  <path d="M 274 345 H 318 V 373 H 362" class="arrow" />
  <path d="M 274 451 H 318 V 423 H 362" class="arrow" />
  <g data-card="reference-invariants">
    <rect x="64" y="526" width="532" height="72" rx="10" class="input" />
    <text x="330" y="555" text-anchor="middle" class="title">Unreferenced declarations stay in the inventory.</text>
    <text x="330" y="580" text-anchor="middle" font-size="15" class="muted">Equal text does not merge distinct Intent IDs.</text>
  </g>
  <text x="64" y="634" font-size="15" class="muted">Not final reachability (owned by 020).</text>

  <rect x="660" y="214" width="580" height="446" rx="12" class="panel" />
  <text x="684" y="248" font-size="20" font-weight="700" class="title">Computation dependency</text>
  <text x="684" y="277" class="muted">A product points to the exact input / facet it consumed.</text>
  <g data-card="owner-product">
    <rect x="684" y="350" width="210" height="96" rx="10" class="step" />
    <text x="789" y="385" text-anchor="middle" font-size="18" font-weight="700" class="white">Owner product</text>
    <text x="789" y="417" text-anchor="middle" font-size="15" class="soft-white">Checked value + evidence</text>
  </g>
  <g data-card="source-input">
    <rect x="1020" y="306" width="196" height="78" rx="10" class="input" />
    <text x="1118" y="337" text-anchor="middle" font-size="18" font-weight="700" class="title">Source input</text>
    <text x="1118" y="365" text-anchor="middle" font-size="15" class="muted">Exact bytes / profile</text>
  </g>
  <g data-card="product-facet">
    <rect x="1020" y="424" width="196" height="78" rx="10" class="input" />
    <text x="1118" y="455" text-anchor="middle" font-size="18" font-weight="700" class="title">Product facet</text>
    <text x="1118" y="483" text-anchor="middle" font-size="15" class="muted">Registered exact value</text>
  </g>
  <path d="M 894 373 H 950 V 345 H 1020" class="arrow" />
  <path d="M 894 423 H 950 V 463 H 1020" class="arrow" />
  <text x="955" y="403" text-anchor="middle" font-size="14" class="muted">consumes</text>
  <g data-card="dependency-invariants">
    <rect x="684" y="526" width="532" height="72" rx="10" class="input" />
    <text x="950" y="555" text-anchor="middle" class="title">Typed role + full stamp + owning operation / profile</text>
    <text x="950" y="580" text-anchor="middle" font-size="15" class="muted">Finite, acyclic relation; optional absence is explicit.</text>
  </g>
  <text x="684" y="634" font-size="15" class="muted">Invalidation walks these edges in reverse.</text>

  <g data-card="index-separation">
    <rect x="40" y="690" width="1200" height="72" rx="12" class="note" />
    <text x="640" y="719" text-anchor="middle" font-size="17" font-weight="700" class="title">Containment and inverse indexes are lookup aids, not computation edges.</text>
    <text x="640" y="745" text-anchor="middle" font-size="15" class="muted">They must not create dependency cycles. An unknown reference target stays blocked / invalid.</text>
  </g>
</svg>
