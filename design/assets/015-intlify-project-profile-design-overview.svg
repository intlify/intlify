<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="title desc">
  <title id="title">Project profile resolution and semantic groups</title>
  <desc id="desc">The intlify_cli repository adapter and an optional programmatic frontend materialize the same JSON-compatible configuration value. The input is resolved by intlify_config together with Profile Specification revision zero, locale canonicalization data, and one finite already acquired Profile Resolution Artifact Set containing Policy and Target Profile artifacts. The resolver admits schema version and structure into IntlifyConfig, selects one named profile, admits semantic artifacts, canonicalizes locales, and resolves semantics. It produces either a complete LocalizationProjectProfile or a blocked result with Findings and evaluation status. Profile ID is selection input rather than checked profile identity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #111827; }
      .subtitle { fill: #4b5563; }
      .label { fill: #111827; }
      .muted { fill: #4b5563; }
      .group { fill: #f8fafc; stroke: #cbd5e1; }
      .profile-group { fill: #f0fdfa; stroke: #0f766e; }
      .card { fill: #ffffff; stroke: #cbd5e1; }
      .file { fill: #0369a1; }
      .api { fill: #7c3aed; }
      .input { fill: #334155; }
      .semantic { fill: #0f766e; }
      .resolver { fill: #1d4ed8; }
      .checked { fill: #0f766e; }
      .blocked { fill: #b45309; }
      .note { fill: #e2e8f0; stroke: #94a3b8; }
      .note-text { fill: #334155; }
      .arrow { stroke: #64748b; }
      .arrow-fill { fill: #64748b; }
      .white { fill: #ffffff; }
      .soft-white { fill: #e5e7eb; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #020617; }
        .title { fill: #f8fafc; }
        .subtitle { fill: #cbd5e1; }
        .label { fill: #f1f5f9; }
        .muted { fill: #cbd5e1; }
        .group { fill: #0f172a; stroke: #475569; }
        .profile-group { fill: #071b1a; stroke: #2dd4bf; }
        .card { fill: #111827; stroke: #475569; }
        .note { fill: #1e293b; stroke: #64748b; }
        .note-text { fill: #e2e8f0; }
        .arrow { stroke: #cbd5e1; }
        .arrow-fill { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="900" class="canvas" />

  <text x="720" y="42" font-size="24" font-weight="700" text-anchor="middle" class="title">Project profile resolution</text>
  <text x="720" y="70" font-size="13" text-anchor="middle" class="subtitle">Authoring inputs and immutable semantic inputs converge on one deterministic checked or blocked outcome.</text>

  <!-- Authoring entry paths -->
  <rect x="40" y="105" width="270" height="440" rx="14" class="group" stroke-width="2" />
  <text x="175" y="138" font-size="16" font-weight="700" text-anchor="middle" class="label">Authoring entry paths</text>
  <text x="175" y="158" font-size="10" text-anchor="middle" class="muted">one JSON-compatible authoring model</text>

  <rect x="60" y="180" width="230" height="100" rx="9" class="file" />
  <text x="175" y="207" font-size="12" font-weight="700" text-anchor="middle" class="white">intlify_cli repository adapter</text>
  <text x="175" y="232" font-size="11" font-weight="700" text-anchor="middle" class="soft-white">intlify.config.json</text>
  <text x="175" y="256" font-size="9.6" text-anchor="middle" class="soft-white">discovery · selector · source evidence</text>

  <rect x="60" y="305" width="230" height="100" rx="9" class="api" />
  <text x="175" y="333" font-size="12" font-weight="700" text-anchor="middle" class="white">Optional programmatic frontend</text>
  <text x="175" y="358" font-size="10.2" font-weight="700" text-anchor="middle" class="soft-white">same JSON-compatible value</text>
  <text x="175" y="382" font-size="9.6" text-anchor="middle" class="soft-white">typed helper · embedded integration</text>

  <rect x="60" y="435" width="230" height="70" rx="9" class="card" />
  <text x="175" y="461" font-size="11" font-weight="700" text-anchor="middle" class="label">Configuration source evidence</text>
  <text x="175" y="482" font-size="9.4" text-anchor="middle" class="muted">file + JSON Pointer · programmatic call</text>

  <!-- Explicit resolver inputs -->
  <path d="M 310 310 L 350 310" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)" />

  <rect x="350" y="105" width="290" height="440" rx="14" class="group" stroke-width="2" />
  <text x="495" y="138" font-size="16" font-weight="700" text-anchor="middle" class="label">Explicit resolver inputs</text>
  <text x="495" y="158" font-size="10" text-anchor="middle" class="muted">authoring value plus admitted semantics</text>

  <rect x="370" y="180" width="250" height="82" rx="9" class="input" />
  <text x="495" y="210" font-size="13" font-weight="700" text-anchor="middle" class="white">Configuration input</text>
  <text x="495" y="235" font-size="9.8" text-anchor="middle" class="soft-white">JSON-compatible value · Profile ID selector</text>

  <rect x="370" y="285" width="250" height="62" rx="9" class="semantic" />
  <text x="495" y="310" font-size="11.5" font-weight="700" text-anchor="middle" class="white">Profile Specification revision "0"</text>
  <text x="495" y="330" font-size="9.4" text-anchor="middle" class="soft-white">checked-profile semantic model</text>

  <rect x="370" y="370" width="250" height="70" rx="9" class="semantic" />
  <text x="495" y="395" font-size="11.2" font-weight="700" text-anchor="middle" class="white">Locale Canonicalization</text>
  <text x="495" y="416" font-size="9.6" text-anchor="middle" class="soft-white">Specification + data provider</text>

  <rect x="370" y="455" width="250" height="70" rx="9" class="semantic" />
  <text x="495" y="477" font-size="10.7" font-weight="700" text-anchor="middle" class="white">Profile Resolution Artifact Set</text>
  <text x="495" y="497" font-size="9.2" text-anchor="middle" class="soft-white">Policy + Target Profile Artifacts</text>
  <text x="495" y="514" font-size="9.0" text-anchor="middle" class="soft-white">finite · immutable · already acquired</text>

  <!-- Resolver pipeline -->
  <path d="M 640 310 L 680 310" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)" />

  <rect x="680" y="90" width="400" height="470" rx="14" class="group" stroke-width="2" />
  <rect x="700" y="118" width="360" height="70" rx="9" class="resolver" />
  <text x="880" y="146" font-size="14" font-weight="700" text-anchor="middle" class="white">intlify_config resolver</text>
  <text x="880" y="169" font-size="10" text-anchor="middle" class="soft-white">dependency-aware · fail-complete · deterministic</text>

  <rect x="710" y="215" width="340" height="55" rx="8" class="card" />
  <text x="730" y="239" font-size="11.2" font-weight="700" class="label">1 · Admit schema version + structure</text>
  <text x="730" y="258" font-size="9.3" class="muted">schemaVersion "0" · JSON Schema · IntlifyConfig</text>

  <rect x="710" y="282" width="340" height="55" rx="8" class="card" />
  <text x="730" y="306" font-size="11.2" font-weight="700" class="label">2 · Select exactly one named profile</text>
  <text x="730" y="325" font-size="9.3" class="muted">sole implicit · multiple requires Profile ID</text>

  <rect x="710" y="349" width="340" height="55" rx="8" class="card" />
  <text x="730" y="373" font-size="11.2" font-weight="700" class="label">3 · Admit specifications + limits</text>
  <text x="730" y="392" font-size="9.3" class="muted">Profile + locale specs · Resource Policy</text>

  <rect x="710" y="416" width="340" height="55" rx="8" class="card" />
  <text x="730" y="440" font-size="11.2" font-weight="700" class="label">4 · Resolve artifact references</text>
  <text x="730" y="459" font-size="9.3" class="muted">Policy + Target Profile · exact immutable pins</text>

  <rect x="710" y="483" width="340" height="55" rx="8" class="card" />
  <text x="730" y="507" font-size="11.2" font-weight="700" class="label">5 · Canonicalize + resolve semantics</text>
  <text x="730" y="526" font-size="9.3" class="muted">canonical projection · Findings · evaluation status</text>

  <!-- Resolution outcomes -->
  <path d="M 1080 310 L 1100 310 L 1100 217 L 1140 217" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)" />
  <path d="M 1100 310 L 1100 360 L 1140 360" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)" />

  <rect x="1120" y="105" width="280" height="440" rx="14" class="group" stroke-width="2" />
  <text x="1260" y="138" font-size="16" font-weight="700" text-anchor="middle" class="label">Resolution outcome</text>
  <text x="1260" y="158" font-size="10" text-anchor="middle" class="muted">exactly one result per invocation</text>

  <rect x="1140" y="180" width="240" height="90" rx="9" class="checked" />
  <text x="1260" y="208" font-size="13" font-weight="700" text-anchor="middle" class="white">Checked</text>
  <text x="1260" y="232" font-size="10.5" font-weight="700" text-anchor="middle" class="soft-white">LocalizationProjectProfile</text>
  <text x="1260" y="252" font-size="9.3" text-anchor="middle" class="soft-white">complete profile + non-blocking Findings</text>

  <rect x="1140" y="315" width="240" height="90" rx="9" class="blocked" />
  <text x="1260" y="343" font-size="13" font-weight="700" text-anchor="middle" class="white">Blocked</text>
  <text x="1260" y="367" font-size="10.2" font-weight="700" text-anchor="middle" class="soft-white">no partial profile</text>
  <text x="1260" y="387" font-size="9.3" text-anchor="middle" class="soft-white">Findings + not-evaluated causes</text>

  <rect x="1140" y="445" width="240" height="62" rx="9" class="card" />
  <text x="1260" y="470" font-size="11" font-weight="700" text-anchor="middle" class="label">Separate diagnostic evidence</text>
  <text x="1260" y="490" font-size="9.2" text-anchor="middle" class="muted">source map · dependency explanation</text>

  <!-- Checked profile contents -->
  <path d="M 1380 225 L 1415 225 L 1415 580 L 720 580 L 720 600" fill="none" class="arrow" stroke-width="2.4" marker-end="url(#arrow)" />

  <rect x="40" y="600" width="1360" height="230" rx="14" class="profile-group" stroke-width="2.5" />
  <text x="720" y="634" font-size="17" font-weight="700" text-anchor="middle" class="label">LocalizationProjectProfile semantic groups</text>
  <text x="720" y="656" font-size="10.5" text-anchor="middle" class="muted">The checked profile contains normalized semantic decisions—not authoring syntax, credentials, or physical output facts.</text>

  <rect x="65" y="690" width="305" height="110" rx="9" class="card" />
  <text x="217" y="719" font-size="12" font-weight="700" text-anchor="middle" class="label">Project scope + identity</text>
  <text x="217" y="747" font-size="10" text-anchor="middle" class="muted">project ID</text>
  <text x="217" y="770" font-size="10" text-anchor="middle" class="muted">Selection Scope</text>

  <rect x="400" y="690" width="305" height="110" rx="9" class="card" />
  <text x="552" y="719" font-size="12" font-weight="700" text-anchor="middle" class="label">Locale model + policies</text>
  <text x="552" y="747" font-size="10" text-anchor="middle" class="muted">source · requested · effective defaults</text>
  <text x="552" y="770" font-size="9.5" text-anchor="middle" class="muted">canonicalization · negotiation · fallback</text>

  <rect x="735" y="690" width="305" height="110" rx="9" class="card" />
  <text x="887" y="719" font-size="12" font-weight="700" text-anchor="middle" class="label">Targets + release grouping</text>
  <text x="887" y="747" font-size="10" text-anchor="middle" class="muted">Target IDs + Profile references</text>
  <text x="887" y="770" font-size="9.7" text-anchor="middle" class="muted">Deployment Compatibility Groups</text>

  <rect x="1070" y="690" width="305" height="110" rx="9" class="card" />
  <text x="1222" y="719" font-size="12" font-weight="700" text-anchor="middle" class="label">Immutable external references</text>
  <text x="1222" y="747" font-size="10" text-anchor="middle" class="muted">delivery · Provider · governance</text>
  <text x="1222" y="770" font-size="10" text-anchor="middle" class="muted">trust · resource policies</text>

  <rect x="250" y="850" width="940" height="34" rx="17" class="note" stroke-width="1.2" />
  <text x="720" y="872" font-size="10.2" font-weight="700" text-anchor="middle" class="note-text">015 fixes semantic meaning · 017 owns shared encoding · source evidence remains outside profile identity</text>
</svg>
