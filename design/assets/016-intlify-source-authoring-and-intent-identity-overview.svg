<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="title desc">
  <title id="title">Source authoring and Intent identity</title>
  <desc id="desc">Immutable source snapshots, checked project context, and an identity registry are explicit inputs to the proposed 016 authoring pipeline. Host discovery feeds shared MF2 and context analysis, then stable identity and finite reference resolution. A complete checked outcome supplies logical Intent, source, and reference facts to shared artifact encoding and downstream consumers. Any stage may instead produce blocking Findings and a proposed reconciliation plan. A separate authorized host operation may publish an accepted registry snapshot for the next invocation. Compilation never writes the registry, translates messages, or rewrites host code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #111827; }
      .muted { fill: #475569; }
      .input { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .step { fill: #1d4ed8; }
      .checked { fill: #0f766e; }
      .blocked { fill: #92400e; }
      .downstream { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.5; }
      .update { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
      .white { fill: #ffffff; }
      .soft-white { fill: #f1f5f9; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-fill { fill: #64748b; }
      .separate { stroke-dasharray: 7 5; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #020617; }
        .title { fill: #f8fafc; }
        .muted { fill: #cbd5e1; }
        .input { fill: #1e293b; stroke: #64748b; }
        .downstream { fill: #062c2a; stroke: #2dd4bf; }
        .update { fill: #30200b; stroke: #fbbf24; }
        .arrow { stroke: #cbd5e1; }
        .arrow-fill { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect width="1280" height="980" class="canvas" />
  <text x="640" y="42" text-anchor="middle" font-size="25" font-weight="700" class="title">Source authoring and Intent identity</text>
  <text x="640" y="72" text-anchor="middle" class="muted">016 defines source meaning and continuity; shared formats and host rewriting retain separate owners.</text>

  <g data-card="source-input">
    <rect x="50" y="115" width="350" height="135" rx="12" class="input" />
    <text x="70" y="145" font-weight="700" class="title">INPUT / source and authoring profile</text>
    <text x="70" y="174" class="muted">Exact snapshots · grammar · bindings</text>
    <text x="70" y="198" class="muted">Finite owner scope and completeness</text>
    <text x="70" y="222" class="muted">No filesystem discovery or code execution</text>
  </g>
  <g data-card="project-input">
    <rect x="465" y="115" width="350" height="135" rx="12" class="input" />
    <text x="485" y="145" font-weight="700" class="title">INPUT / checked authoring context</text>
    <text x="485" y="174" class="muted">015 source default and vocabulary</text>
    <text x="485" y="198" class="muted">Explicit locale data / assignment inputs</text>
    <text x="485" y="222" class="muted">No ambient locale or inferred vocabulary</text>
  </g>
  <g data-card="registry-input">
    <rect x="880" y="115" width="350" height="135" rx="12" class="input" />
    <text x="900" y="145" font-weight="700" class="title">INPUT / identity registry snapshot</text>
    <text x="900" y="174" class="muted">Persistent IDs · active / retired lineage</text>
    <text x="900" y="198" class="muted">Exact base and continuity evidence</text>
    <text x="900" y="222" class="muted">Compiler-managed; no translations</text>
  </g>

  <path d="M 225 250 V 330" class="arrow" />
  <path d="M 640 250 V 330" class="arrow" />
  <path d="M 1055 250 V 330" class="arrow" />

  <g data-card="discovery">
    <rect x="50" y="330" width="350" height="180" rx="12" class="step" />
    <text x="70" y="362" font-size="17" font-weight="700" class="white">1 / Host discovery</text>
    <text x="70" y="394" class="soft-white">Proven UI literals · intent() · mf2</text>
    <text x="70" y="420" class="soft-white">Explicit exclusions and source maps</text>
    <text x="70" y="446" class="soft-white">Bounded receiver / reference analysis</text>
    <text x="70" y="483" font-size="12" class="soft-white">Host-specific Producer / 016</text>
  </g>
  <g data-card="semantics">
    <rect x="465" y="330" width="350" height="180" rx="12" class="step" />
    <text x="485" y="362" font-size="17" font-weight="700" class="white">2 / Message and context analysis</text>
    <text x="485" y="394" class="soft-white">Shared MF2 syntax / semantics: 001, 012</text>
    <text x="485" y="420" class="soft-white">Source locale · class · semantic context</text>
    <text x="485" y="446" class="soft-white">Static parameter / selector requirements</text>
    <text x="485" y="483" font-size="12" class="soft-white">Language-neutral authoring meaning / 016</text>
  </g>
  <g data-card="identity">
    <rect x="880" y="330" width="350" height="180" rx="12" class="step" />
    <text x="900" y="362" font-size="17" font-weight="700" class="white">3 / Identity and references</text>
    <text x="900" y="394" class="soft-white">Stable ID and semantic revision</text>
    <text x="900" y="420" class="soft-white">Proven continuity; explicit conflicts</text>
    <text x="900" y="446" class="soft-white">Finite Intent references and result checks</text>
    <text x="900" y="483" font-size="12" class="soft-white">Identity resolution / result construction: 016</text>
  </g>
  <path d="M 400 420 H 465" class="arrow" />
  <path d="M 815 420 H 880" class="arrow" />
  <path d="M 1055 510 V 550 H 415 V 605" class="arrow" />
  <path d="M 1055 550 V 605" class="arrow" />

  <g data-card="checked-output">
    <rect x="50" y="605" width="730" height="170" rx="12" class="checked" />
    <text x="70" y="638" font-size="18" font-weight="700" class="white">OUTPUT / complete checked authoring facts</text>
    <text x="70" y="671" class="soft-white">Logical Intent and source-message content · finite references</text>
    <text x="70" y="697" class="soft-white">Exact input dependencies · minimum source evidence · exclusions</text>
    <text x="70" y="723" class="soft-white">Explicit scope and completeness; no partial build input</text>
    <text x="70" y="753" font-size="12" class="soft-white">Not approval, final reachability, target validity, or generated code</text>
  </g>
  <g data-card="blocked-output">
    <rect x="830" y="605" width="400" height="170" rx="12" class="blocked" />
    <text x="850" y="638" font-size="18" font-weight="700" class="white">OUTPUT / blocked or update required</text>
    <text x="850" y="671" class="soft-white">Findings from any stage</text>
    <text x="850" y="697" class="soft-white">Inspection facts, not complete compiler input</text>
    <text x="850" y="723" class="soft-white">A proposed reconciliation plan, when applicable</text>
    <text x="850" y="753" font-size="12" class="soft-white">Ambiguity or limits never become successful absence</text>
  </g>
  <path d="M 415 775 V 820" class="arrow" />
  <path d="M 1030 775 V 820" class="arrow separate" />

  <g data-card="downstream">
    <rect x="50" y="820" width="730" height="95" rx="12" class="downstream" />
    <text x="70" y="850" font-weight="700" class="title">017 representations → 019 graph → 020 planning and later consumers</text>
    <text x="70" y="880" class="muted">Source lowering and generated references: 024 / 028; not this operation</text>
  </g>
  <g data-card="registry-update">
    <rect x="830" y="820" width="400" height="95" rx="12" class="update" />
    <text x="850" y="850" font-weight="700" class="title">Separate authorized registry update</text>
    <text x="850" y="876" class="muted">016 rules · 017 format · 018 trust · 029 storage</text>
    <text x="850" y="899" font-size="12" class="muted">Accepted snapshot becomes the next invocation's input</text>
  </g>
  <path d="M 1230 866 H 1254 V 182 H 1230" class="arrow separate" />

  <text x="640" y="951" text-anchor="middle" font-size="13" class="muted">Compilation is read-only. No Provider calls, registry publication, or host-code rewriting occurs inside the 016 pipeline.</text>
</svg>
