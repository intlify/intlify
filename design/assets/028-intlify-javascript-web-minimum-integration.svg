<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1040" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="title desc">
  <title id="title">Minimum JavaScript/Web integration for source authoring</title>
  <desc id="desc">One finite local application supplies checked source, context, and registry inputs. Source analysis and explicit identity updates produce facts for a complete English and Japanese requirement plan. Separate fixture synchronization and governance produce a pinned Translation Store snapshot. A deterministic build consumes the source facts and Store snapshot, recomputes planning, links, and lowers the application without Provider calls or publication. Local Release Assembly, separately authorized publication, and host activation precede Runtime-backed and ahead-of-time execution. Both execution paths contribute exact logical and browser observations to the minimum 016 Phase 5 verification scope under 026. Shared formats and trust remain owned by their component specifications. This local application scope is not complete I1 support.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #111827; }
      .muted { fill: #475569; }
      .input { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .step { fill: #1d4ed8; }
      .supply { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
      .output { fill: #0f766e; }
      .verified { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.5; }
      .white { fill: #ffffff; }
      .soft-white { fill: #f1f5f9; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-fill, .join { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #020617; }
        .title { fill: #f8fafc; }
        .muted { fill: #cbd5e1; }
        .input { fill: #1e293b; stroke: #64748b; }
        .supply { fill: #30200b; stroke: #fbbf24; }
        .verified { fill: #062c2a; stroke: #2dd4bf; }
        .arrow { stroke: #cbd5e1; }
        .arrow-fill, .join { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect width="1280" height="1040" class="canvas" />
  <text x="640" y="42" text-anchor="middle" font-size="25" font-weight="700" class="title">Minimum JavaScript/Web integration</text>
  <text x="640" y="73" text-anchor="middle" class="muted">One application · en / ja · DOM text and string interpolation · explicit local operations</text>

  <g data-card="inputs">
    <rect x="50" y="110" width="1180" height="90" rx="12" class="input" />
    <text x="70" y="140" font-weight="700" class="title">INPUTS / immutable fixtures and admitted specifications</text>
    <text x="70" y="169" class="muted">Source + HTML · owner / locale / vocabulary inputs · registry history · policies / capabilities · explicit local authority</text>
  </g>
  <path d="M 225 200 V 250" class="arrow" />

  <g data-card="authoring">
    <rect x="50" y="250" width="350" height="175" rx="12" class="step" />
    <text x="70" y="282" font-size="18" font-weight="700" class="white">Source and Intent identity</text>
    <text x="70" y="315" class="soft-white">Proven DOM text · intent() · mf2 · noIntent()</text>
    <text x="70" y="342" class="soft-white">Checked facts, IDs, revisions, and maps</text>
    <text x="70" y="369" class="soft-white">Registry updates are separate operations</text>
    <text x="70" y="403" font-size="12" class="soft-white">016 meaning · 017 formats · 018 / 029 update rules</text>
  </g>
  <g data-card="planning">
    <rect x="465" y="250" width="350" height="175" rx="12" class="step" />
    <text x="485" y="282" font-size="18" font-weight="700" class="white">Complete requirement planning</text>
    <text x="485" y="315" class="soft-white">Three Intents × two requested locales</text>
    <text x="485" y="342" class="soft-white">Source fulfillment for en stays visible</text>
    <text x="485" y="369" class="soft-white">Missing ja demand feeds explicit sync</text>
    <text x="485" y="403" font-size="12" class="soft-white">019 local scope · 020 requirements</text>
  </g>
  <g data-card="supply">
    <rect x="880" y="250" width="350" height="175" rx="12" class="supply" />
    <text x="900" y="282" font-size="18" font-weight="700" class="title">Explicit localization supply</text>
    <text x="900" y="315" class="muted">Fixture Provider → candidate validation</text>
    <text x="900" y="342" class="muted">Separate publication and governance</text>
    <text x="900" y="369" class="muted">Stored ≠ selectable ≠ selected</text>
    <text x="900" y="403" font-size="12" class="muted">021 / 022 · no external translation service</text>
  </g>
  <path d="M 400 335 H 465" class="arrow" />
  <path d="M 815 335 H 880" class="arrow" />

  <path d="M 225 425 V 560" class="arrow" />
  <text x="65" y="474" class="muted">Source facts</text>
  <text x="65" y="497" class="muted">and context</text>
  <path d="M 1055 425 V 475 H 440 V 515 H 231" class="arrow" />
  <circle cx="225" cy="515" r="4" class="join" />
  <text x="700" y="459" text-anchor="middle" class="muted">Pinned Store snapshot with selection evidence</text>

  <g data-card="build">
    <rect x="50" y="560" width="350" height="190" rx="12" class="step" />
    <text x="70" y="592" font-size="18" font-weight="700" class="white">Deterministic application build</text>
    <text x="70" y="626" class="soft-white">Recompute plan · verify selection · link</text>
    <text x="70" y="653" class="soft-white">Lower source · generate both output sets</text>
    <text x="70" y="680" class="soft-white">No Provider calls or registry / Store writes</text>
    <text x="70" y="729" font-size="12" class="soft-white">020 linking · 024 generation · 028 JS rewrite</text>
  </g>
  <g data-card="release">
    <rect x="465" y="560" width="350" height="190" rx="12" class="step" />
    <text x="485" y="592" font-size="18" font-weight="700" class="white">Local Release handoff</text>
    <text x="485" y="626" class="soft-white">Match bindings, artifacts, and profiles</text>
    <text x="485" y="653" class="soft-white">Assemble → publish → host activates</text>
    <text x="485" y="680" class="soft-white">Keep each admission check separate</text>
    <text x="485" y="729" font-size="12" class="soft-white">025 specification · explicit fixture host actions</text>
  </g>
  <g data-card="execution">
    <rect x="880" y="560" width="350" height="190" rx="12" class="output" />
    <text x="900" y="592" font-size="18" font-weight="700" class="white">Two compatible execution paths</text>
    <text x="900" y="626" class="soft-white">027 / Runtime-backed evaluation</text>
    <text x="900" y="653" class="soft-white">024 / Ahead-of-time generated code</text>
    <text x="900" y="680" class="soft-white">Explicit en / ja contexts · real DOM</text>
    <text x="900" y="729" font-size="12" class="soft-white">Same selected messages and 023 semantics</text>
  </g>
  <path d="M 400 655 H 465" class="arrow" />
  <path d="M 815 655 H 880" class="arrow" />
  <path d="M 1055 750 V 800 H 640 V 850" class="arrow" />

  <g data-card="verification">
    <rect x="50" y="850" width="1180" height="110" rx="12" class="verified" />
    <text x="70" y="883" font-size="18" font-weight="700" class="title">OUTPUT / scoped 016 Phase 5 Web evidence</text>
    <text x="70" y="912" class="muted">English and Japanese UI · Runtime / AOT logical equivalence · host evaluation order · exclusions · failure cases</text>
    <text x="70" y="940" class="muted">026 conformance and footprint observations; missing owner specifications or required evidence never count as passed.</text>
  </g>
  <text x="640" y="1004" text-anchor="middle" font-size="13" class="muted">028 connects the components. Full I1, library composition, production tooling, and broader capabilities remain separate work.</text>
</svg>
