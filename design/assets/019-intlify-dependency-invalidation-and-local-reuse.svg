<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 950" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" role="img" aria-labelledby="title desc">
  <title id="title">Explain changes, then explicitly run new analysis</title>
  <desc id="desc">A read-only change query compares compatible old and new snapshots by exact typed input slots, membership, presence states, and full stamps. It follows reverse computation dependencies and returns affected candidates with reasons, not verified reuse. An unsupported comparison is not-comparable and never schedules a rebuild. A separate caller-scheduled analysis admits new inputs and checks optional bounded cache entries against complete operation and dependency keys, retained content, and current limits. A valid hit may reuse an immutable checked owner product; a miss uses normal owner computation. Current output facets and source evidence are checked, changed associations are rebuilt, and a new view or explicit failure is returned. The old snapshot stays immutable, no live authority is cached, and no-cache execution is the semantic reference.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fill" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #111827; }
      .muted { fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .input { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .step { fill: #1d4ed8; }
      .output { fill: #0f766e; }
      .note { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
      .white { fill: #ffffff; }
      .soft-white { fill: #f1f5f9; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-fill { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #020617; }
        .title { fill: #f8fafc; }
        .muted { fill: #cbd5e1; }
        .panel { fill: #0f172a; stroke: #475569; }
        .input { fill: #1e293b; stroke: #64748b; }
        .note { fill: #30200b; stroke: #fbbf24; }
        .arrow { stroke: #cbd5e1; }
        .arrow-fill { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect width="1280" height="950" class="canvas" />
  <text x="640" y="42" text-anchor="middle" font-size="25" font-weight="700" class="title">Explain changes, then explicitly run new analysis</text>
  <text x="640" y="74" text-anchor="middle" class="muted">Comparison is read-only; verified reuse requires a separate new invocation.</text>

  <rect x="40" y="106" width="1200" height="314" rx="12" class="panel" />
  <text x="64" y="142" font-size="20" font-weight="700" class="title">1 / Read-only change explanation</text>
  <g data-card="compare-captures">
    <rect x="64" y="174" width="320" height="118" rx="10" class="input" />
    <text x="84" y="205" font-size="18" font-weight="700" class="title">Compare exact captures</text>
    <text x="84" y="237" class="muted">Old + new views · compatible scope</text>
    <text x="84" y="266" class="muted">Typed slots, membership, full stamps</text>
  </g>
  <g data-card="reverse-dependencies">
    <rect x="456" y="174" width="360" height="118" rx="10" class="step" />
    <text x="476" y="205" font-size="18" font-weight="700" class="white">Trace reverse dependencies</text>
    <text x="476" y="237" class="soft-white">Changed inputs + affected old products</text>
    <text x="476" y="266" class="soft-white">Bounded traversal + typed reason paths</text>
  </g>
  <g data-card="change-explanation">
    <rect x="896" y="174" width="320" height="118" rx="10" class="output" />
    <text x="916" y="205" font-size="18" font-weight="700" class="white">Change explanation</text>
    <text x="916" y="237" class="soft-white">Affected candidates + reasons</text>
    <text x="916" y="266" class="soft-white">Not verified reuse</text>
  </g>
  <path d="M 384 233 H 456" class="arrow" />
  <path d="M 816 233 H 896" class="arrow" />
  <g data-card="not-comparable">
    <rect x="64" y="326" width="440" height="70" rx="10" class="note" />
    <text x="84" y="354" font-size="16" font-weight="700" class="title">Unsupported comparison → not-comparable</text>
    <text x="84" y="379" font-size="15" class="muted">Does not rebuild or report an empty affected set.</text>
  </g>
  <text x="544" y="354" class="muted">This query never schedules owner work or publishes state.</text>
  <text x="544" y="382" class="muted">A new analysis is a separate, caller-scheduled invocation.</text>

  <rect x="40" y="460" width="1200" height="398" rx="12" class="panel" />
  <text x="64" y="496" font-size="20" font-weight="700" class="title">2 / Explicit new analysis with optional bounded reuse</text>
  <g data-card="new-inputs">
    <rect x="64" y="532" width="260" height="112" rx="10" class="input" />
    <text x="84" y="563" font-size="18" font-weight="700" class="title">New admitted inputs</text>
    <text x="84" y="595" class="muted">Recheck current admission</text>
    <text x="84" y="623" font-size="15" class="muted">Full operation / dependency key</text>
  </g>
  <g data-card="cache-lookup">
    <rect x="394" y="532" width="352" height="112" rx="10" class="step" />
    <text x="414" y="563" font-size="18" font-weight="700" class="white">Validate optional cache entry</text>
    <text x="414" y="595" class="soft-white">Complete key + retained content</text>
    <text x="414" y="623" class="soft-white">Current limits; no cached authority</text>
  </g>
  <g data-card="owner-computation">
    <rect x="896" y="532" width="320" height="112" rx="10" class="step" />
    <text x="916" y="563" font-size="18" font-weight="700" class="white">Compute owner operation</text>
    <text x="916" y="595" class="soft-white">No cache / miss / invalid entry</text>
    <text x="916" y="623" class="soft-white">New inputs · dependency order</text>
  </g>
  <path d="M 324 588 H 394" class="arrow" />
  <path d="M 746 588 H 896" class="arrow" />
  <text x="821" y="574" text-anchor="middle" font-size="14" class="muted">miss</text>

  <g data-card="cache-invariants">
    <rect x="64" y="718" width="260" height="112" rx="10" class="input" />
    <text x="84" y="750" font-size="16" font-weight="700" class="title">Bounded, optional cache</text>
    <text x="84" y="779" font-size="15" class="muted">No-cache is the reference result</text>
    <text x="84" y="807" font-size="15" class="muted">No live grants or mutable state</text>
  </g>
  <g data-card="current-evidence">
    <rect x="394" y="718" width="352" height="112" rx="10" class="step" />
    <text x="414" y="750" font-size="18" font-weight="700" class="white">Check output facets + evidence</text>
    <text x="414" y="779" class="soft-white">Reuse only exact, valid owner products</text>
    <text x="414" y="807" class="soft-white">Rebuild changed maps / associations</text>
  </g>
  <g data-card="new-result">
    <rect x="896" y="718" width="320" height="112" rx="10" class="output" />
    <text x="916" y="750" font-size="18" font-weight="700" class="white">New result</text>
    <text x="916" y="779" class="soft-white">New checked / inspection-only view</text>
    <text x="916" y="807" class="soft-white">or explicit failure</text>
  </g>
  <path d="M 570 644 V 718" class="arrow" />
  <text x="590" y="685" font-size="14" class="muted">valid hit</text>
  <path d="M 1056 644 V 682 H 780 V 740 H 746" class="arrow" />
  <text x="898" y="669" text-anchor="middle" font-size="14" class="muted">owner result</text>
  <path d="M 746 794 H 896" class="arrow" />

  <text x="640" y="897" text-anchor="middle" class="muted">Previous snapshots stay immutable. A failed new invocation never returns an old snapshot as success.</text>
  <text x="640" y="925" text-anchor="middle" font-size="15" class="muted">Fresh input / disclosure checks apply on cache hits; changed source evidence still needs new maps and exact associations.</text>
</svg>
