[package]
name = "intlify_cli"
version = "0.14.0-alpha.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
benchmark = ["intlify_linker/benchmark", "intlify_producer_js/benchmark"]

[[bin]]
name = "intlify"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
blake3 = "=1.8.5"
# Filesystem-capability crates are exact-pinned so their no-follow semantics cannot drift.
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
file-id = "0.2"
getrandom = "=0.4.3"
glob = "0.3"
intlify_contract = { path = "../intlify_contract" }
intlify_export = { path = "../intlify_export" }
intlify_format = { path = "../intlify_format" }
intlify_linker = { path = "../intlify_linker" }
intlify_producer_js = { path = "../intlify_producer_js" }
intlify_resource = { path = "../intlify_resource" }
ox_mf2_parser = { path = "../ox_mf2_parser" }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.106", features = ["arbitrary_precision", "preserve_order"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
blake3 = "=1.8.5"
