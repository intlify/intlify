[package]
name = "intlify_measurement"
version = "0.14.0-alpha.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Reading a clock, the kernel, or the compiler is not part of reading a record,
# so ordinary consumers of these records never pull in a system API or run the
# build script's compiler query.
acquisition = ["dep:rustix"]
# The scaffolding an observing owner runs on: capture, its own sealed record,
# the adapter onto the common pipeline, and the smoke runner. It reads a clock,
# so it needs acquisition, and it frames native checksums with blake3.
owner-run = ["acquisition", "dep:blake3"]

[dependencies]
# 017 token grammars, exact quantities, canonical framing, domain-separated
# digests, and bounded strict reading. The digest feature is required here
# because every common record carries an integrity digest.
intlify_shared_json = { path = "../intlify_shared_json", features = ["digest"] }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.106", features = ["arbitrary_precision", "preserve_order"] }
# Fresh instance identities only; no timestamp, PID, hostname, or caller input.
# These records are representation, not acquisition, so they are portable: the
# clock and system views that are POSIX-only stay with the owner that acquires
# them.
getrandom = { version = "=0.4.3" }
# The owner-run native checksum algorithm. Every owner frames its own values
# under its own label, so one algorithm does not make two owners' checksums
# comparable.
blake3 = { version = "=1.8.7", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Locked safe clock and kernel-view APIs, for acquisition only.
rustix = { version = "=1.1.5", features = ["system", "time"], optional = true }

[dev-dependencies]
# Independent Draft 7 oracle; no HTTP/file retrieval, TLS, or IDNA/ICU data.
# Exactly the version every other crate's schema tests use: two oracles would
# be two answers about whether a generated schema admits a record.
jsonschema = { version = "=0.56.0", default-features = false }
