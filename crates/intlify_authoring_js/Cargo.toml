[package]
name = "intlify_authoring_js"
version = "0.14.0-alpha.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Observational measurement of source discovery and inventory assembly,
# excluded from ordinary Producer consumers. It enables the shared crate's
# test context because the only context this phase admits is the test-owned
# one: what is measured is the real analysis, and the owner record says where
# its inputs came from.
benchmark = [
  "dep:intlify_measurement",
  "dep:schemars",
  "dep:serde",
  "intlify_authoring/test-context"
]

[dependencies]
# Every meaning is decided there: this crate reads host syntax and hands the
# decoded result over, so it never re-derives what a message is.
intlify_authoring = { path = "../intlify_authoring" }
# `@intlify` annotations are decoded with the same duplicate-rejecting JSON
# reader the shared crate uses, and sealing an inventory reports its encoding
# failures. Both crates are already in its dependency graph.
intlify_shared_json = { path = "../intlify_shared_json", features = ["digest"] }
serde_json = "1.0.106"
# Keep the exact pins aligned with intlify_producer_js, because Oxc crates
# share internal API contracts and upgrading one without the other breaks both.
oxc_allocator = "=0.141.0"
oxc_ast = "=0.141.0"
oxc_ast_visit = "=0.141.0"
oxc_diagnostics = "=0.141.0"
# The default feature validates regular expression literals, whose syntax
# errors are early errors a conforming host rejects.
oxc_parser = "=0.141.0"
oxc_semantic = "=0.141.0"
oxc_span = "=0.152.0"
# The owner-neutral 026 records and the owner run that captures and seals them,
# with the derives this owner's own record fragments need. Ordinary consumers
# never build any of them.
intlify_measurement = { path = "../intlify_measurement", features = ["owner-run"], optional = true }
schemars = { version = "1.0", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# The only context this phase admits is the explicitly test-owned one. Enabling
# it for test targets alone keeps the ordinary build unable to construct it.
intlify_authoring = { path = "../intlify_authoring", features = ["test-context"] }
# Fixtures name their bytes by digest, as a caller would.
intlify_shared_json = { path = "../intlify_shared_json", features = ["digest"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[[bench]]
name = "authoring_js_discovery"
harness = false
test = false
required-features = ["benchmark"]
