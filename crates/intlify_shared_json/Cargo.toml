[package]
name = "intlify_shared_json"
version = "0.14.0-alpha.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Domain-separated digests need a hash implementation. Ordinary configuration
# decoding and duplicate-aware reading paths must not pull one in.
digest = ["dep:sha2"]

[dependencies]
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Match the exact feature selection used by every workspace consumer so decoded
# values behave identically when this crate is built standalone.
serde_json = { version = "1.0.106", features = ["arbitrary_precision", "preserve_order"] }
sha2 = { version = "=0.10.9", default-features = false, optional = true }

[dev-dependencies]
# Independent Draft 7 oracle; no HTTP/file retrieval, TLS, or IDNA/ICU data.
jsonschema = { version = "=0.52.1", default-features = false }
