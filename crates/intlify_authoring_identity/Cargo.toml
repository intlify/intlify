[package]
name = "intlify_authoring_identity"
version = "0.14.0-alpha.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Observational measurement of reconciliation and registry replay, excluded
# from ordinary consumers. Its fixtures are produced by the real JS Producer
# under the test-owned context, outside every measured interval, so what is
# measured is reconciliation on real inventories. Nothing here allocates an
# ID: the candidates a fixture supplies are fixed.
benchmark = [
  "dep:intlify_authoring_js",
  "dep:intlify_measurement",
  "dep:intlify_shared_json",
  "intlify_authoring/test-context"
]

[dependencies]
# What a message is, and what one analysis found, are decided there. This crate
# adds persistent identity on top and never re-derives either.
intlify_authoring = { path = "../intlify_authoring" }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# The committed schemas are generated as JSON values.
serde_json = "1.0.106"
# The owner-neutral 026 records and the owner run that captures and seals them,
# the Producer that reads the fixtures, and the counts and digests the records
# carry. Ordinary consumers never build any of them.
intlify_authoring_js = { path = "../intlify_authoring_js", optional = true }
intlify_measurement = { path = "../intlify_measurement", features = ["owner-run"], optional = true }
intlify_shared_json = { path = "../intlify_shared_json", features = ["digest"], optional = true }

[dev-dependencies]
# The vectors are built from real inventories, and the only context this phase
# admits is the explicitly test-owned one. Enabling it for test targets and
# examples alone keeps the ordinary build unable to construct it.
intlify_authoring = { path = "../intlify_authoring", features = ["test-context"] }
# Design 028's module is carried from source to compiled artifacts through
# the real Producer, which never learns an identity itself.
intlify_authoring_js = { path = "../intlify_authoring_js" }
# Fixtures name their bytes by digest, as a caller would.
intlify_shared_json = { path = "../intlify_shared_json", features = ["digest"] }
# Independent Draft 7 oracle; no HTTP/file retrieval, TLS, or IDNA/ICU data.
jsonschema = { version = "=0.56.0", default-features = false }
# The smoke writes its records into a fresh directory of its own.
tempfile = "3"

[[bench]]
name = "authoring_identity_reconciliation"
harness = false
test = false
required-features = ["benchmark"]
