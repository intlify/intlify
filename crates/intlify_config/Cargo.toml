[package]
name = "intlify_config"
version = "0.14.0-alpha.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Display-only support for the resolve_config contributor example.
dev-example = []
# The ICU4X 2.2.0 reference adapter as the locale provider. Ordinary
# configuration consumers build without it and link neither ICU4X nor locale
# data. With it, the provider still reads only the artifact bytes its caller
# acquired.
icu4x = ["dep:intlify_locale_icu4x"]
# Measurement support is excluded from ordinary configuration consumers. It
# measures canonicalization through the ICU4X provider as well, so it compiles
# in the adapter's committed artifact as a measurement fixture.
benchmark = ["dep:blake3", "dep:getrandom", "dep:intlify_measurement", "dep:serde_json", "icu4x"]
# Developer-only generation of the committed 017 vectors. No codec, reader, or
# admission becomes public.
vectors = []

[dependencies]
# Shared 017 token grammars, exact quantities, framing, bounded reading, and
# the domain-separated digest: the resolver admits the vocabulary artifact by
# its integrity and semantic digest, as it will later 017 artifacts by theirs.
intlify_shared_json = { path = "../intlify_shared_json", features = ["digest"] }
# The owner-neutral 026 records. Ordinary configuration consumers never build
# it: measurement is reachable only through the non-default benchmark feature.
intlify_measurement = { path = "../intlify_measurement", features = [
  "acquisition"
], optional = true }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.106", features = ["arbitrary_precision", "preserve_order"] }
blake3 = { version = "=1.8.7", optional = true }
# Reachable only through the non-default icu4x feature.
intlify_locale_icu4x = { path = "../intlify_locale_icu4x", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Fresh owner-run nonce; no timestamp, PID, hostname, or caller-supplied identity.
getrandom = { version = "=0.4.3", optional = true }

[build-dependencies]
# Build-time observations are produced only for the benchmark feature.
blake3 = { version = "=1.8.7", optional = true }
serde_json = { version = "1.0.106", optional = true }

[dev-dependencies]
# Independent Draft 7 oracle; no HTTP/file retrieval, TLS, or IDNA/ICU data.
# Reuse the version already locked for intlify_contract's schema tests.
jsonschema = { version = "=0.56.0", default-features = false }
tempfile = "3"

[[example]]
name = "generate_measurement_schema"
required-features = ["benchmark"]

[[example]]
name = "generate_envelope_vectors"
required-features = ["vectors"]

[[example]]
name = "generate_vocabulary_vectors"
required-features = ["vectors"]

[[example]]
name = "resolve_config"
path = "examples/resolve_config/main.rs"
required-features = ["dev-example"]

[[bench]]
name = "profile_resolver"
harness = false
test = false
required-features = ["benchmark"]
