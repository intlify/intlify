[package]
name = "intlify_locale_icu4x"
version = "0.14.0-alpha.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Writes the complete artifact, from ICU4X's compiled data and the vendored
# CLDR records, and the reader's fixture blobs, and runs the corpus gate over
# the vendored CLDR corpus. Only the generators, the gate, and their tests
# link that data; the adapter itself reads nothing but the bytes it is given.
generate = [
  "icu_locale/compiled_data",
  "dep:icu_locale_data",
  "icu_provider_blob/export",
  "dep:roxmltree",
  "dep:zerovec"
]

[dependencies]
# ICU4X 2.2.0 exactly, as design 015 pins it, without compiled data: the four
# marker families reach the adapter only through a blob. `datagen` gives the
# data structs the serde serialization that defines their logical payloads.
icu_locale = { version = "=2.2.0", default-features = false, features = ["serde", "datagen"] }
# Pinned as well, since `icu_locale` alone resolves it to a later release.
icu_locale_core = "=2.2.0"
icu_provider = { version = "=2.2.0", features = ["serde", "deserialize_postcard_1"] }
icu_provider_blob = { version = "=2.2.0", features = ["alloc"] }
# The generator's only source: ICU4X's data generated from CLDR 48.2.0.
icu_locale_data = { version = "=2.2.0", optional = true }
# 017's primitives, value framing, canonical JSON text, and the
# domain-separated digest. Hashing lives here, not in `intlify_config`.
intlify_shared_json = { path = "../intlify_shared_json", features = ["digest"] }
# Reads the blob's marker index, which ICU4X keeps in private types.
postcard = { version = "1", default-features = false }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.106", features = ["arbitrary_precision", "preserve_order"] }
# Reads the vendored CLDR records for the generator. It fetches no DTD.
roxmltree = { version = "0.21", optional = true }
# Rewrites a fixture blob's locale index in the wide layout, which ICU4X's
# exporter chooses only for large data.
zerovec = { version = "0.11", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
# Independent Draft 7 oracle; no HTTP/file retrieval, TLS, or IDNA/ICU data.
jsonschema = { version = "=0.56.0", default-features = false }

[[example]]
name = "generate_locale_data"
required-features = ["generate"]

[[example]]
name = "generate_artifact_fixtures"
required-features = ["generate"]

[[example]]
name = "generate_gap_registry"
required-features = ["generate"]
