[package]
name = "intlify_producer_js"
version = "0.14.0-alpha.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
intlify_contract = { path = "../intlify_contract" }
# 0.75.0 is the final OXC release in this series whose declared MSRV is 1.85.0.
# Keep the exact pins aligned: 0.75.1 raises the OXC MSRV to Rust 1.86.0.
oxc_allocator = "=0.75.0"
oxc_ast = "=0.75.0"
oxc_ast_visit = "=0.75.0"
oxc_parser = { version = "=0.75.0", default-features = false }
oxc_span = "=0.75.0"
